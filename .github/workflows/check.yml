# SPDX-License-Identifier: MIT
name: source check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-game-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refuse game assets and generated code
        run: python -I tools/check_repo.py
